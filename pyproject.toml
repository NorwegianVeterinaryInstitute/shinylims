[project]
name = "shinylims-uv"
version = "1.7.0"
authors = [
  { name="Magnus Leithaug", email="magnus.leithaug@vetinst.no" },
]

description = "A shiny app to display lab metadata from clarity LIMS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faicons==0.2.2",
    "itables==2.9.1",
    "pandas==2.3.3",
    "pins==0.8.5",
    "psycopg[binary]>=3.3.4,<4",
    "python-dotenv>=1.0.1",
    "seaborn==0.13.2",
    "shiny[theme]==1.6.4",
    "brand-yml==0.2.0",
    "shinyswatch==0.6.1",
    "sqlalchemy>=2.0,<3",
    "plotly==7.1.0",
    "shinywidgets==0.8.2",
    "tomli==2.4.1",
    "paramiko==5.1.0",
    "scp==0.15.0"

]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.uv]
required-version = ">=0.13.4"

[tool.hatch.build.targets.wheel]
packages = ["src/shinylims"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
